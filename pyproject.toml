[project]
name = "portvolume"
version = "0.1.0"
description = "Sentinel-1 SAR port/airport monitoring pipeline with economic correlation"
requires-python = ">=3.9"
dependencies = [
    # Data access
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "rioxarray>=0.15",
    "xarray>=2023.1",

    # SAR processing & detection
    "rasterio>=1.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",

    # Geospatial
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",

    # Economic data
    "fredapi>=0.5",
    "yfinance>=0.2",

    # Analysis
    "pyarrow>=14.0",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",

    # Config
    "pyyaml>=6.0",

    # Visualization
    "matplotlib>=3.7",
    "plotly>=5.15",
    "folium>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "jupyter",
    "ipykernel",
]

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require network access",
]
